name: Robô de iPhone

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:          # botão "Run workflow" = rodada de teste com resumo no Telegram

permissions:
  contents: write             # para salvar a lista de ofertas já avisadas (vistos.json)

concurrency:
  group: robo-iphone
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Procurar ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robo.py

      - name: Salvar ofertas já avisadas
        if: always()
        run: |
          git config user.name "robo-iphone"
          git config user.email "robo-iphone@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "atualiza vistos" && git push)
